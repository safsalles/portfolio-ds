[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memga"
version = "1.2.0"
description = "Multiple Choice Method (MEM): select a set of alternatives that complement each other, by exhaustive search or a genetic algorithm"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sérgio Augusto Faria Salles", email = "safsalles@hotmail.com" },
    { name = "Henrique Rego Monteiro da Hora" },
]
keywords = ["multicriteria", "decision-making", "genetic-algorithm", "selection", "mem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/safsalles/portfolio-ds/tree/main/mem-ga"
Issues = "https://github.com/safsalles/portfolio-ds/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memga = ["data/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
