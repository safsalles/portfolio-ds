projetos:
  - id: job-finder
    nome: Radar de Vagas (Job Finder)
    link: github.com/safsalles/portfolio-ds
    fonte: portfolio-ds/job-finder (README e commits até 2026-11-08)
    texto:
      pt: "Bot em Python (Playwright e APIs públicas) que busca vagas em 8 fontes, classifica, filtra por título, modalidade e local, calcula a afinidade com as minhas competências e envia as vagas novas por e-mail todo dia. Testes automatizados."
      en: "Python bot (Playwright and public APIs) that searches job postings across 8 sources, classifies and filters them by title, work model and location, scores the match with my skills and emails the new postings every day. Automated tests."
      es: "Bot en Python (Playwright y APIs públicas) que busca ofertas en 8 fuentes, las clasifica y filtra por título, modalidad y ubicación, calcula la afinidad con mis competencias y envía las ofertas nuevas por correo a diario."
  - id: mem-ga
    nome: MEM-GA (memga)
    link: github.com/safsalles/portfolio-ds
    fonte: portfolio-ds/mem-ga (README, CITATION.cff e commits até 2026-11-08)
    texto:
      pt: "Pacote do método multicritério com algoritmo genético da minha dissertação. Publicado no PyPI (Python), no R-universe (R) e no File Exchange (MATLAB e Octave), com testes automatizados e DOI no Zenodo."
      en: "Package for the multicriteria method with a genetic algorithm from my master's thesis. Published on PyPI (Python), R-universe (R) and File Exchange (MATLAB and Octave), with automated tests and a Zenodo DOI."
      es: "Paquete del método multicriterio con algoritmo genético de mi tesis de maestría. Publicado en PyPI (Python), R-universe (R) y File Exchange (MATLAB y Octave), con DOI en Zenodo."
  - id: football-analytics
    nome: Football Analytics
    link: github.com/safsalles/portfolio-ds
    fonte: portfolio-ds/football-analytics (README e commits até 2026-11-08)
    texto:
      pt: "Análises de futebol com dados do Brasileirão 2017 e o pacote memga: monta o time de 10 jogadores de linha que mais se completa em uma formação e sugere contratações que melhoram a complementação de um clube. Python, notebook de análise e testes automatizados."
      en: "Soccer analytics with 2017 Brazilian league data and the memga package: builds the 10-outfield-player team that complements itself best in a formation and suggests signings that improve a club's complementarity. Python, analysis notebook and automated tests."
      es: "Análisis de fútbol con datos del Brasileirão 2017 y el paquete memga: arma el equipo de 10 jugadores de campo que más se complementa en una formación y sugiere fichajes que mejoran la complementariedad de un club. Python, notebook de análisis y pruebas automatizadas."
  - id: curriculos
    nome: {pt: Sistema de Currículos, en: Résumé System, es: Sistema de Currículums}
    link: ""
    fonte: conversa 2026-11-07
    texto:
      pt: "Sistema em Python que gera currículos em PDF em 3 idiomas e em versões por área a partir de uma base única de carreira em YAML, com validação dos dados, checagem automática de números e páginas, histórico de versões e testes automatizados (pytest). Desenvolvido com IA (Claude Code), da especificação aos testes."
      en: "Python system that generates PDF résumés in 3 languages and role-specific versions from a single YAML career database, with data validation, automatic number and page checks, version history and automated tests (pytest). Built with AI (Claude Code), from specification to tests."
      es: "Sistema en Python que genera currículums en PDF en 3 idiomas y en versiones por área a partir de una base única de carrera en YAML, con validación de datos, verificación automática de cifras y páginas, historial de versiones y pruebas automatizadas (pytest). Desarrollado con IA (Claude Code), de la especificación a las pruebas."
  - id: portfolio-ds
    nome: {pt: Portfólio no GitHub, en: GitHub Portfolio, es: Portafolio en GitHub}
    link: github.com/safsalles/portfolio-ds
    fonte: conversa 2026-11-07
    texto:
      pt: "Repositório público de projetos de Data Science e automação, organizado por projeto, com README em português e inglês, dependências e, nos projetos de análise, testes automatizados (pytest) e notebook. Os projetos mais recentes são especificados antes do código e desenvolvidos com IA (Claude Code)."
      en: "Public repository of Data Science and automation projects, organized by project, with READMEs in Portuguese and English, dependencies and, in the analysis projects, automated tests (pytest) and a notebook. The most recent projects are specified before coding and built with AI (Claude Code)."
      es: "Repositorio público de proyectos de Data Science y automatización, organizado por proyecto, con README en portugués e inglés, dependencias y, en los proyectos de análisis, pruebas automatizadas (pytest) y notebook. Los proyectos más recientes se especifican antes del código y se desarrollan con IA (Claude Code)."
