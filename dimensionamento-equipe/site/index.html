let L='pt',t=T.pt,modo={modelo:true,regra:true},metaSel='todas',metrica='espera_media_s',grupo='todos',ag=D.varredura.atual;
const $=id=>document.getElementById(id),tip=$('tip');
const nf=(v,d=0)=>v.toLocaleString(L==='pt'?'pt-BR':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(v,d=1)=>nf(v*100,d)+'%';
function el(n,a={},p){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a={}){const e=el('text',{x,y,...a},p);e.textContent=s;return e}
function svg(id,h,label){const host=$(id);host.textContent='';const w=Math.max(300,host.clientWidth||800);const s=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':label},host);return[s,w,h]}
function show(e,s){tip.textContent=s;tip.style.display='block';const x=e.clientX,y=e.clientY,w=tip.offsetWidth;tip.style.left=Math.min(x+14,innerWidth-w-8)+'px';tip.style.top=(y+16)+'px'}
const hide=()=>tip.style.display='none';
function hover(node,s){node.addEventListener('pointermove',e=>show(e,s));node.addEventListener('pointerleave',hide);node.setAttribute('tabindex','0');node.addEventListener('focus',()=>{const r=node.getBoundingClientRect();show({clientX:r.right,clientY:r.top},s)});node.addEventListener('blur',hide)}
function table(id,head,rows){const host=$(id);host.textContent='';const tb=document.createElement('table');[head,...rows].forEach((r,i)=>{const tr=tb.insertRow();r.forEach(c=>{const td=document.createElement(i?'td':'th');td.textContent=c;tr.appendChild(td)})});host.appendChild(tb)}
function buttons(id,list,active,fn){const h=$(id);h.textContent='';list.forEach(([k,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(active(k)));b.onclick=()=>fn(k);h.appendChild(b)})}
function legend(id,items){const h=$(id);h.textContent='';items.forEach(([c,s])=>{const e=document.createElement('span'),i=document.createElement('i');i.style.background=`var(${c})`;e.append(i,s);h.appendChild(e)})}
function yAxis(s,w,m,y,max,fmt){for(let i=0;i<=4;i++){const v=max*i/4,py=y(v);el('line',{x1:m.l,x2:w-m.r,y1:py,y2:py,stroke:i?'var(--grid)':'var(--axis)'},s);txt(s,m.l-8,py+4,fmt(v),{'text-anchor':'end'})}}
const path=(a,x,y)=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
function crosshair(s,w,h,m,n,x,fn){const g=el('line',{y1:m.t,y2:h-m.b,stroke:'var(--muted)',opacity:0},s),hit=el('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b,fill:'transparent'},s);let k=0;
 const go=(i,e)=>{k=Math.max(0,Math.min(n-1,i));g.setAttribute('x1',x(k));g.setAttribute('x2',x(k));g.setAttribute('opacity',1);show(e,fn(k))};
 hit.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect(),px=(e.clientX-r.left)*w/r.width;go(Math.round((px-m.l)/(w-m.l-m.r)*(n-1)),e)});
 hit.addEventListener('pointerleave',()=>{g.setAttribute('opacity',0);hide()});
 s.setAttribute('tabindex','0');s.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();const r=s.getBoundingClientRect();go(k+(e.key==='ArrowRight'?1:-1),{clientX:r.left+x(k)*r.width/w,clientY:r.top+20})});s.addEventListener('blur',()=>{g.setAttribute('opacity',0);hide()})}

function c1(){const M=D.chegadas.media,max=Math.max(...M.flat());let pd=0,ph=0;M.forEach((r,d)=>r.forEach((v,h)=>{if(v>M[pd][ph]){pd=d;ph=h}}));
 $('t1').textContent=t.t1(t.noDia(pd),ph,nf(M[pd][ph]));
 const[s,w]=svg('c1',300,$('t1').textContent),m={l:40,r:4,t:4},cw=(w-m.l-m.r)/24,ch=34;
 M.forEach((r,d)=>{txt(s,m.l-8,m.t+d*ch+21,t.dc[d],{'text-anchor':'end'});r.forEach((v,h)=>{const c=el('rect',{x:m.l+h*cw+1,y:m.t+d*ch+1,width:Math.max(2,cw-2),height:ch-2,rx:3,fill:`var(--h${Math.min(7,Math.floor(v/max*7.999))})`},s);if(d===pd&&h===ph){c.setAttribute('stroke','var(--ink)');c.setAttribute('stroke-width',2)}hover(c,`${t.dias[d]}, ${h}h\n${nf(v,1)} ${t.chamadas}`)})});
 for(let h=0;h<24;h+=3)txt(s,m.l+h*cw+cw/2,m.t+7*ch+16,h+'h',{'text-anchor':'middle'});
 for(let i=0;i<8;i++)el('rect',{x:m.l+i*22,y:m.t+7*ch+30,width:20,height:10,rx:2,fill:`var(--h${i})`},s);
 txt(s,m.l+8*22+8,m.t+7*ch+39,`0 – ${nf(max)} ${t.chamadas}`);
 table('d1',[t.hora,...t.dc],[...Array(24).keys()].map(h=>[h+'h',...M.map(r=>nf(r[h],1))]))}

function c2(){const P=D.previsao,E=P.erros;$('t2').textContent=t.t2(pc(E.modelo),pc(E.regra));
 const k=$('k2');k.textContent='';[['regra','--s2'],['modelo','--s1'],['unico',null]].forEach(([n])=>{const d=document.createElement('div');d.className='tile';const b=document.createElement('b'),sp=document.createElement('span');b.textContent=pc(E[n]);sp.textContent=t[n];d.append(sp,b);k.appendChild(d)});
 buttons('b2',[['modelo',t.modelo],['regra',t.regra]],x=>modo[x],x=>{modo[x]=!modo[x];c2()});
 legend('l2',[['--ink',t.real],...(modo.modelo?[['--s1',t.modelo]]:[]),...(modo.regra?[['--s2',t.regra]]:[])]);
 const[s,w,h]=svg('c2',320,$('t2').textContent),m={l:44,r:8,t:10,b:28},max=Math.ceil(Math.max(...P.real,...P.modelo,...P.regra)/100)*100,x=i=>m.l+i/167*(w-m.l-m.r),y=v=>h-m.b-v/max*(h-m.t-m.b);
 yAxis(s,w,m,y,max,v=>nf(v));for(let d=0;d<7;d++){if(d)el('line',{x1:x(d*24),x2:x(d*24),y1:m.t,y2:h-m.b,stroke:'var(--grid)'},s);txt(s,x(d*24+12),h-8,t.dc[d],{'text-anchor':'middle'})}
 const line=(a,c,wd)=>el('path',{d:path(a,x,y),fill:'none',stroke:c,'stroke-width':wd,'stroke-linejoin':'round'},s);
 if(modo.regra)line(P.regra,'var(--s2)',2);if(modo.modelo)line(P.modelo,'var(--s1)',2);line(P.real,'var(--ink)',1.5);
 crosshair(s,w,h,m,168,x,i=>`${t.dc[Math.floor(i/24)]} ${i%24}h\n${t.real}: ${nf(P.real[i])}\n${t.modelo}: ${nf(P.modelo[i])}\n${t.regra}: ${nf(P.regra[i])}`);
 table('d2',[t.hora,t.real,t.modelo,t.regra],P.real.map((v,i)=>[`${t.dc[Math.floor(i/24)]} ${i%24}h`,nf(v),nf(P.modelo[i],1),nf(P.regra[i],1)]))}

function c3(){const Q=D.equipe,names=Object.keys(Q.por_hora),cost=Q.custo;$('t3').textContent=t.t3(pc(cost['90/30']/cost['80/20']-1));
 buttons('b3',[['todas',t.grupos.todos],...names.map(n=>[n,n])],x=>metaSel===x,x=>{metaSel=x;c3()});
 const col={'80/20':'--s1','90/30':'--s2'},vis=names.filter(n=>metaSel==='todas'||metaSel===n);legend('l3',vis.map(n=>[col[n],`${t.meta} ${n}`]));
 const[s,w,h]=svg('c3',300,$('t3').textContent),m={l:44,r:52,t:12,b:28},max=Math.ceil(Math.max(...names.flatMap(n=>Q.por_hora[n]))/20)*20,x=i=>m.l+i/23*(w-m.l-m.r),y=v=>h-m.b-v/max*(h-m.t-m.b);
 yAxis(s,w,m,y,max,v=>nf(v));for(let i=0;i<24;i+=3)txt(s,x(i),h-8,i+'h',{'text-anchor':'middle'});
 vis.forEach(n=>{const a=Q.por_hora[n];el('path',{d:path(a,x,y),fill:'none',stroke:`var(${col[n]})`,'stroke-width':2},s);const p=a.indexOf(Math.max(...a));el('circle',{cx:x(p),cy:y(a[p]),r:4,fill:`var(${col[n]})`,stroke:'var(--surface)','stroke-width':2},s);txt(s,w-m.r+6,y(a[23])+(n==='90/30'?-3:11),n,{class:'lab'})});
 crosshair(s,w,h,m,24,x,i=>`${i}h\n`+vis.map(n=>`${n}: ${nf(Q.por_hora[n][i],1)} ${t.pessoas}`).join('\n'));
 table('d3',[t.hora,...names],[...Array(24).keys()].map(i=>[i+'h',...names.map(n=>nf(Q.por_hora[n][i],1))]))}

function c4(){const V=D.varredura,R=V.linhas,get=a=>R.find(r=>r.agents===a),base=get(V.atual),less=get(V.atual-1);
 $('t4').textContent=t.t4(V.atual,pc(base.service_level,0),pc(less.service_level,0));$('p4').textContent=t.p4(nf(V.chamadas_hora),pc(V.meta,0),V.espera_s);
 const sl=$('sl');sl.min=R[0].agents;sl.max=R[R.length-1].agents;sl.value=ag;const r=get(ag),ok=r.service_level>=V.meta;
 $('lb4').textContent=`${t.equipeDe} ${ag} ${t.agentes}`;
 const k=$('k4');k.textContent='';[[t.nivel+' · '+t.emAte(V.espera_s),pc(r.service_level)],[t.esperaM,r.stable?nf(r.wait_mean_s)+' s':t.instavel],[t.vsBase,(r.service_level>=base.service_level?'+':'')+nf((r.service_level-base.service_level)*100,1)+' p.p.'],[t.meta+' '+pc(V.meta,0),ok?'✓':'✗']].forEach(([a,b])=>{const d=document.createElement('div');d.className='tile';const s=document.createElement('span'),v=document.createElement('b');s.textContent=a;v.textContent=b;d.append(s,v);k.appendChild(d)});
 const[s,w,h]=svg('c4',290,$('t4').textContent),m={l:48,r:12,t:14,b:36},n=R.length,x=i=>m.l+i/(n-1)*(w-m.l-m.r),y=v=>h-m.b-v*(h-m.t-m.b);
 yAxis(s,w,m,y,1,v=>pc(v,0));el('line',{x1:m.l,x2:w-m.r,y1:y(V.meta),y2:y(V.meta),stroke:'var(--ink2)','stroke-dasharray':'6 4'},s);txt(s,m.l+6,y(V.meta)-6,t.meta+' '+pc(V.meta,0),{class:'lab'});
 el('path',{d:path(R.map(q=>q.service_level),x,y),fill:'none',stroke:'var(--s1)','stroke-width':2},s);
 R.forEach((q,i)=>{const sel=q.agents===ag;txt(s,x(i),h-m.b+18,q.agents,{'text-anchor':'middle',...(sel?{class:'lab'}:{})});
  if(!q.stable)el('path',{d:`M${x(i)-5} ${y(q.service_level)-5}l10 10m0-10l-10 10`,stroke:'var(--crit)','stroke-width':2},s);
  else el('circle',{cx:x(i),cy:y(q.service_level),r:sel?8:4,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2},s);
  const hit=el('circle',{cx:x(i),cy:y(q.service_level),r:14,fill:'transparent',style:'cursor:pointer'},s);hover(hit,`${q.agents} ${t.agentes}\n${t.nivel}: ${pc(q.service_level)}\n${q.stable?t.esperaM+': '+nf(q.wait_mean_s)+' s':t.instavel}`);hit.addEventListener('click',()=>{ag=q.agents;hide();c4()})});
 txt(s,(m.l+w-m.r)/2,h-2,t.agentes,{'text-anchor':'middle'});
 table('d4',[t.agentes,t.nivel,t.esperaM+' (s)'],R.map(q=>[q.agents,pc(q.service_level),q.stable?nf(q.wait_mean_s,1):t.instavel]))}

function c5(){const B=D.banco,get=k=>B.cenarios.find(c=>c.chave===k),m5=k=>get(k).janela.espera_media_s;
 const real=m5('real'),ideal=m5('presenca'),ps=['pausas2','pausas5','pausas10'].map(m5),lo=Math.min(...ps),hi=Math.max(...ps);
 $('t5').textContent=t.t5(nf(ideal),nf(real));$('p5').textContent=t.p5(B.hora,nf(B.ligacoes));$('f5').textContent=t.f5;
 const rows=[[t.b5real,real,null,'--ink'],[t.b5ideal,ideal,null,'--s1'],[t.b5pausas,lo,hi,'--s1']];
 const[s,w,h]=svg('c5',rows.length*72+28,$('t5').textContent),m={l:2,r:12},max=Math.ceil(hi/50)*50,x=v=>m.l+v/max*(w-m.l-m.r);
 for(let i=0;i<=max;i+=50){el('line',{x1:x(i),x2:x(i),y1:0,y2:h-24,stroke:i?'var(--grid)':'var(--axis)'},s);txt(s,x(i),h-6,nf(i)+' s',{'text-anchor':i?(i===max?'end':'middle'):'start'})}
 rows.forEach(([nome,a,b,cor],i)=>{const y=i*72+4,g=el('g',{},s),val=b?`${nf(a)} – ${nf(b)} s`:nf(a)+' s';
  txt(g,m.l+6,y+13,`${nome}: ${val}`,{class:'lab'});
  const bar=(v,op)=>el('path',{d:`M${x(0)} ${y+22}H${x(v)-4}q4 0 4 4v18q0 4 -4 4H${x(0)}z`,fill:`var(${cor})`,opacity:op},g);
  if(b){bar(b,.35);bar(a,1)}else bar(a,1);
  const hit=el('rect',{x:0,y,width:w,height:56,fill:'transparent'},g);hover(hit,`${nome}\n${t.metricas.espera_media_s}: ${val}`+(b?'\n'+t.faixa:''))});
 table('d5',[t.cenario,...Object.values(t.metricas)],['real','presenca','pausas10','pausas5','pausas2'].map(k=>{const c=get(k);return[c[L==='pt'?'rotulo_pt':'rotulo_en'],...Object.keys(t.metricas).map(q=>q==='nivel_servico'?pc(c.janela[q]):nf(c.janela[q],1))]}))}
const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function all(){t=T[L];document.documentElement.lang=L==='pt'?'pt-BR':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);$('lang').textContent=t.outra;$('theme').textContent=dark()?t.claro:t.escuro;c1();c2();c3();c4();c5()}
$('lang').onclick=()=>{L=L==='pt'?'en':'pt';all()};
$('theme').onclick=()=>{document.documentElement.dataset.theme=dark()?'light':'dark';all()};
$('sl').addEventListener('input',e=>{ag=+e.target.value;c4()});
let rz,lw=innerWidth;addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rz);rz=setTimeout(all,150)});
addEventListener('scroll',hide,{passive:true});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>all());
all();
