<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--s1:#2a78d6;--s2:#eb6834;--soft:#86b6ef;--crit:#d03b3b;
 --h0:#eef5fd;--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#256abf;--h6:#184f95;--h7:#0d366b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--s1:#3987e5;--s2:#d95926;--soft:#1c5cab;
 --h0:#1f2326;--h1:#0d366b;--h2:#104281;--h3:#184f95;--h4:#256abf;--h5:#3987e5;--h6:#6da7ec;--h7:#cde2fb}}
:root[data-theme=dark]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--s1:#3987e5;--s2:#d95926;--soft:#1c5cab;
 --h0:#1f2326;--h1:#0d366b;--h2:#104281;--h3:#184f95;--h4:#256abf;--h5:#3987e5;--h6:#6da7ec;--h7:#cde2fb}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:0 18px 80px}
header{padding:64px 0 24px}
.bar{display:flex;gap:8px;justify-content:flex-end;padding-top:14px}
h1{font-size:clamp(30px,5.4vw,52px);line-height:1.12;margin:0 0 16px;letter-spacing:-.02em}

p{color:var(--ink2);margin:0 0 14px;max-width:68ch}
.step{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
section{padding:52px 0 0}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px;position:relative}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 14px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--page)}
button:focus-visible,input:focus-visible,svg:focus-visible,summary:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 14px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px}
.tile b{display:block;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink2);margin:0 0 8px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
svg{display:block;width:100%;overflow:visible;touch-action:pan-y}
svg text{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
svg text.lab{fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none;z-index:9;max-width:260px;white-space:pre-line}
input[type=range]{width:100%;accent-color:var(--s1);height:32px}
details{margin-top:12px;font-size:13px;color:var(--ink2)}
summary{cursor:pointer}
.scroll{overflow:auto;max-height:320px}
table{border-collapse:collapse;width:100%;margin-top:8px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
footer{margin-top:64px;border-top:1px solid var(--grid);padding-top:20px;font-size:14px}
a{color:var(--s1)}
@media (prefers-reduced-motion:no-preference){.fade{transition:opacity .25s}}
</style>

<script>
const D=JSON.parse(document.getElementById('dados').textContent);
const T={pt:{
kicker:'Workforce Management',h1:'Quantas pessoas são necessárias, hora a hora?',
intro:'Cinco perguntas, da chegada das chamadas à escala: o que os dados respondem e onde eles não chegam.',
ficticio:'Equipe, metas, folga e tempo de atendimento do dimensionamento são fictícios: é um cenário didático.',
s1:'1 · Quando as chamadas chegam?',s2:'2 · Dá para prever?',s3:'3 · Quanta gente é preciso?',s4:'4 · E se entrar ou sair uma pessoa?',s5:'5 · Dá para confiar na conta?',
t1:(d,h,v)=>`O pico é ${d}, às ${h}h, com ${v} chamadas por hora em média`,
p1:'Chamadas de telefone ao NYC 311 em 2024 e 2025, média por dia da semana e hora (horário de Nova York). Quanto mais a cor se destaca do fundo, mais chamadas (veja a legenda).',
t2:(m,r)=>`A previsão empata com a regra simples: erro de ${m} contra ${r}`,
p2:'Uma semana do ano de teste. O modelo é reajustado todo mês só com dados passados; a regra simples é a média das quatro semanas anteriores. Erro medido no ano inteiro (WAPE, menor é melhor).',
t3:x=>`Atender mais rápido custa ${x} a mais de pessoas-hora`,
p3:'Pessoas escaladas na média dos dias úteis do ano de teste, calculadas por Erlang C. A meta 90/30 quer 90% atendidos em até 30 s; a 80/20, 80% em até 20 s.',
t4:(a,b,c)=>`Com ${a} pessoas o serviço fica em ${b}; com uma a menos, ${c}`,
p4:(c,m,s)=>`Simulação com ${c} chamadas por hora e atendimento ajustado em tempos reais. Meta: ${m} atendidos em até ${s} s. Arraste para contratar ou perder gente.`,
t5:(i,r)=>`Contar só quem está presente subestima a espera: ${i} s na simulação, ${r} s na vida real`,
b5real:'O que aconteceu no banco',b5ideal:'Com os atendentes presentes, sem pausas',b5pausas:'Tirando as pausas',faixa:'A faixa depende do que se conta como pausa.',
f5:'A barra com pausas vai do menor ao maior valor, conforme o que se conta como pausa. As pausas mudam muito o resultado, por isso o dimensionamento leva uma folga. Elas foram medidas no próprio dia simulado, e a diferença ainda não está totalmente explicada.',
p5:(h,n)=>`Call center de um banco (Technion, 1999), dias úteis das ${h}h às ${h+1}h, ${n} ligações atendidas. Antes de decidir com a conta, comparamos a simulação com um banco que registrou a espera de verdade. Abaixo, a espera média.`,
tabela:'Ver os dados em tabela',dias:['segunda','terça','quarta','quinta','sexta','sábado','domingo'],dc:['seg','ter','qua','qui','sex','sáb','dom'],
noDia:d=>(d>4?'no ':'na ')+['segunda','terça','quarta','quinta','sexta','sábado','domingo'][d],
chamadas:'chamadas/h',hora:'hora',real:'Real',modelo:'Modelo',regra:'Regra simples',unico:'Modelo ajustado uma vez',ver:'Mostrar:',pessoas:'pessoas escaladas',
agentes:'agentes',nivel:'nível de serviço',esperaM:'espera média',atual:'cenário base',meta:'meta',instavel:'fila sem controle',equipeDe:'Equipe de',emAte:s=>`atendidos em até ${s} s`,
vsBase:'contra o cenário base',metricas:{espera_media_s:'Espera média (s)',nivel_servico:'Atendidas em até 20 s',mediana_s:'Mediana da espera (s)'},
grupos:{todos:'Todos',fixo:'Equipe fixa',medidos:'Atendentes medidos',pausas:'Com pausas'},cenario:'Cenário',
limites:'Limites: a hora de abertura do chamado é tratada como hora de chegada; o Erlang C supõe chegadas aleatórias, atendimento exponencial e ninguém desistindo; a simulação não modela abandono.',
fontes:'Fontes: NYC 311 (NYC Open Data) para as chegadas; Technion SEE Center, base Anonymous Bank (Guedj e Mandelbaum, 2000), para os tempos de atendimento. As duas bases não têm relação entre si.',
codigo:'Ver o código, os testes e a análise completa no GitHub',claro:'Tema claro',escuro:'Tema escuro',outra:'English'},
en:{
kicker:'Workforce Management',h1:'How many people are needed, hour by hour?',
intro:'Five questions, from call arrivals to staffing: what the data answers and where it stops.',
ficticio:'Team, targets, shrinkage and handling time in the staffing scenario are fictional: this is a teaching scenario.',
s1:'1 · When do calls arrive?',s2:'2 · Can it be forecast?',s3:'3 · How many people?',s4:'4 · What if one person joins or leaves?',s5:'5 · Can the numbers be trusted?',
t1:(d,h,v)=>`The peak is ${d} at ${h}:00, with ${v} calls per hour on average`,
p1:'NYC 311 phone calls in 2024 and 2025, average by weekday and hour (New York time). The more a cell stands out from the background, the more calls (see the legend).',
t2:(m,r)=>`The forecast ties the simple rule: ${m} error versus ${r}`,
p2:'One week of the test year. The model is refitted every month with past data only; the simple rule averages the previous four weeks. Error measured on the whole year (WAPE, lower is better).',
t3:x=>`Answering faster costs ${x} more agent-hours`,
p3:'Scheduled staff, weekday average over the test year, from Erlang C. The 90/30 target wants 90% answered within 30 s; 80/20 wants 80% within 20 s.',
t4:(a,b,c)=>`With ${a} people service level is ${b}; with one fewer, ${c}`,
p4:(c,m,s)=>`Simulation with ${c} calls per hour and handling time fitted on real data. Target: ${m} answered within ${s} s. Drag to hire or lose people.`,
t5:(i,r)=>`Counting only who is present underestimates the wait: ${i} s simulated, ${r} s in real life`,
b5real:'What happened at the bank',b5ideal:'With the agents present, no breaks',b5pausas:'Removing breaks',faixa:'The range depends on what counts as a break.',
f5:'The breaks bar spans the lowest to the highest value, depending on what counts as a break. Breaks change the result a lot, which is why staffing includes shrinkage. They were measured on the simulated day itself, and the gap is still not fully explained.',
p5:(h,n)=>`A bank call center (Technion, 1999), weekdays ${h}:00 to ${h+1}:00, ${n} served calls. Before deciding on these numbers, we compare the simulation with a bank that recorded the real wait. Below, the mean wait.`,
tabela:'View the data as a table',dias:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],dc:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
noDia:d=>'on '+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][d],
chamadas:'calls/h',hora:'hour',real:'Actual',modelo:'Model',regra:'Simple rule',unico:'Model fitted once',ver:'Show:',pessoas:'scheduled people',
agentes:'agents',nivel:'service level',esperaM:'mean wait',atual:'base scenario',meta:'target',instavel:'queue out of control',equipeDe:'Team of',emAte:s=>`answered within ${s} s`,
vsBase:'vs base scenario',metricas:{espera_media_s:'Mean wait (s)',nivel_servico:'Answered within 20 s',mediana_s:'Median wait (s)'},
grupos:{todos:'All',fixo:'Fixed team',medidos:'Measured agents',pausas:'With breaks'},cenario:'Scenario',
limites:'Limits: ticket opening time is treated as arrival time; Erlang C assumes random arrivals, exponential handling and no abandonment; the simulation does not model abandonment.',
fontes:'Sources: NYC 311 (NYC Open Data) for arrivals; Technion SEE Center, Anonymous Bank data (Guedj and Mandelbaum, 2000), for handling times. The two datasets are unrelated.',
codigo:'See the code, tests and full analysis on GitHub',claro:'Light theme',escuro:'Dark theme',outra:'Português'}};
let L='pt',t=T.pt,modo={modelo:true,regra:true},metaSel='todas',metrica='espera_media_s',grupo='todos',ag=D.varredura.atual;
const $=id=>document.getElementById(id),tip=$('tip');
const nf=(v,d=0)=>v.toLocaleString(L==='pt'?'pt-BR':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(v,d=1)=>nf(v*100,d)+'%';
function el(n,a={},p){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,a={}){const e=el('text',{x,y,...a},p);e.textContent=s;return e}
function svg(id,h,label){const host=$(id);host.textContent='';const w=Math.max(300,host.clientWidth||800);const s=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':label},host);return[s,w,h]}
function show(e,s){tip.textContent=s;tip.style.display='block';const x=e.clientX,y=e.clientY,w=tip.offsetWidth;tip.style.left=Math.min(x+14,innerWidth-w-8)+'px';tip.style.top=(y+16)+'px'}
const hide=()=>tip.style.display='none';
function hover(node,s){node.addEventListener('pointermove',e=>show(e,s));node.addEventListener('pointerleave',hide);node.setAttribute('tabindex','0');node.addEventListener('focus',()=>{const r=node.getBoundingClientRect();show({clientX:r.right,clientY:r.top},s)});node.addEventListener('blur',hide)}
function table(id,head,rows){const host=$(id);host.textContent='';const tb=document.createElement('table');[head,...rows].forEach((r,i)=>{const tr=tb.insertRow();r.forEach(c=>{const td=document.createElement(i?'td':'th');td.textContent=c;tr.appendChild(td)})});host.appendChild(tb)}
function buttons(id,list,active,fn){const h=$(id);h.textContent='';list.forEach(([k,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(active(k)));b.onclick=()=>fn(k);h.appendChild(b)})}
function legend(id,items){const h=$(id);h.textContent='';items.forEach(([c,s])=>{const e=document.createElement('span'),i=document.createElement('i');i.style.background=`var(${c})`;e.append(i,s);h.appendChild(e)})}
function yAxis(s,w,m,y,max,fmt){for(let i=0;i<=4;i++){const v=max*i/4,py=y(v);el('line',{x1:m.l,x2:w-m.r,y1:py,y2:py,stroke:i?'var(--grid)':'var(--axis)'},s);txt(s,m.l-8,py+4,fmt(v),{'text-anchor':'end'})}}
const path=(a,x,y)=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
function crosshair(s,w,h,m,n,x,fn){const g=el('line',{y1:m.t,y2:h-m.b,stroke:'var(--muted)',opacity:0},s),hit=el('rect',{x:m.l,y:m.t,width:w-m.l-m.r,height:h-m.t-m.b,fill:'transparent'},s);let k=0;
 const go=(i,e)=>{k=Math.max(0,Math.min(n-1,i));g.setAttribute('x1',x(k));g.setAttribute('x2',x(k));g.setAttribute('opacity',1);show(e,fn(k))};
 hit.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect(),px=(e.clientX-r.left)*w/r.width;go(Math.round((px-m.l)/(w-m.l-m.r)*(n-1)),e)});
 hit.addEventListener('pointerleave',()=>{g.setAttribute('opacity',0);hide()});
 s.setAttribute('tabindex','0');s.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();const r=s.getBoundingClientRect();go(k+(e.key==='ArrowRight'?1:-1),{clientX:r.left+x(k)*r.width/w,clientY:r.top+20})});s.addEventListener('blur',()=>{g.setAttribute('opacity',0);hide()})}

function c1(){const M=D.chegadas.media,max=Math.max(...M.flat());let pd=0,ph=0;M.forEach((r,d)=>r.forEach((v,h)=>{if(v>M[pd][ph]){pd=d;ph=h}}));
 $('t1').textContent=t.t1(t.noDia(pd),ph,nf(M[pd][ph]));
 const[s,w]=svg('c1',300,$('t1').textContent),m={l:40,r:4,t:4},cw=(w-m.l-m.r)/24,ch=34;
 M.forEach((r,d)=>{txt(s,m.l-8,m.t+d*ch+21,t.dc[d],{'text-anchor':'end'});r.forEach((v,h)=>{const c=el('rect',{x:m.l+h*cw+1,y:m.t+d*ch+1,width:Math.max(2,cw-2),height:ch-2,rx:3,fill:`var(--h${Math.min(7,Math.floor(v/max*7.999))})`},s);if(d===pd&&h===ph){c.setAttribute('stroke','var(--ink)');c.setAttribute('stroke-width',2)}hover(c,`${t.dias[d]}, ${h}h\n${nf(v,1)} ${t.chamadas}`)})});
 for(let h=0;h<24;h+=3)txt(s,m.l+h*cw+cw/2,m.t+7*ch+16,h+'h',{'text-anchor':'middle'});
 for(let i=0;i<8;i++)el('rect',{x:m.l+i*22,y:m.t+7*ch+30,width:20,height:10,rx:2,fill:`var(--h${i})`},s);
 txt(s,m.l+8*22+8,m.t+7*ch+39,`0 – ${nf(max)} ${t.chamadas}`);
 table('d1',[t.hora,...t.dc],[...Array(24).keys()].map(h=>[h+'h',...M.map(r=>nf(r[h],1))]))}

function c2(){const P=D.previsao,E=P.erros;$('t2').textContent=t.t2(pc(E.modelo),pc(E.regra));
 const k=$('k2');k.textContent='';[['regra','--s2'],['modelo','--s1'],['unico',null]].forEach(([n])=>{const d=document.createElement('div');d.className='tile';const b=document.createElement('b'),sp=document.createElement('span');b.textContent=pc(E[n]);sp.textContent=t[n];d.append(sp,b);k.appendChild(d)});
 buttons('b2',[['modelo',t.modelo],['regra',t.regra]],x=>modo[x],x=>{modo[x]=!modo[x];c2()});
 legend('l2',[['--ink',t.real],...(modo.modelo?[['--s1',t.modelo]]:[]),...(modo.regra?[['--s2',t.regra]]:[])]);
 const[s,w,h]=svg('c2',320,$('t2').textContent),m={l:44,r:8,t:10,b:28},max=Math.ceil(Math.max(...P.real,...P.modelo,...P.regra)/100)*100,x=i=>m.l+i/167*(w-m.l-m.r),y=v=>h-m.b-v/max*(h-m.t-m.b);
 yAxis(s,w,m,y,max,v=>nf(v));for(let d=0;d<7;d++){if(d)el('line',{x1:x(d*24),x2:x(d*24),y1:m.t,y2:h-m.b,stroke:'var(--grid)'},s);txt(s,x(d*24+12),h-8,t.dc[d],{'text-anchor':'middle'})}
 const line=(a,c,wd)=>el('path',{d:path(a,x,y),fill:'none',stroke:c,'stroke-width':wd,'stroke-linejoin':'round'},s);
 if(modo.regra)line(P.regra,'var(--s2)',2);if(modo.modelo)line(P.modelo,'var(--s1)',2);line(P.real,'var(--ink)',1.5);
 crosshair(s,w,h,m,168,x,i=>`${t.dc[Math.floor(i/24)]} ${i%24}h\n${t.real}: ${nf(P.real[i])}\n${t.modelo}: ${nf(P.modelo[i])}\n${t.regra}: ${nf(P.regra[i])}`);
 table('d2',[t.hora,t.real,t.modelo,t.regra],P.real.map((v,i)=>[`${t.dc[Math.floor(i/24)]} ${i%24}h`,nf(v),nf(P.modelo[i],1),nf(P.regra[i],1)]))}

function c3(){const Q=D.equipe,names=Object.keys(Q.por_hora),cost=Q.custo;$('t3').textContent=t.t3(pc(cost['90/30']/cost['80/20']-1));
 buttons('b3',[['todas',t.grupos.todos],...names.map(n=>[n,n])],x=>metaSel===x,x=>{metaSel=x;c3()});
 const col={'80/20':'--s1','90/30':'--s2'},vis=names.filter(n=>metaSel==='todas'||metaSel===n);legend('l3',vis.map(n=>[col[n],`${t.meta} ${n}`]));
 const[s,w,h]=svg('c3',300,$('t3').textContent),m={l:44,r:52,t:12,b:28},max=Math.ceil(Math.max(...names.flatMap(n=>Q.por_hora[n]))/20)*20,x=i=>m.l+i/23*(w-m.l-m.r),y=v=>h-m.b-v/max*(h-m.t-m.b);

function c4(){const V=D.varredura,R=V.linhas,get=a=>R.find(r=>r.agents===a),base=get(V.atual),less=get(V.atual-1);
 $('t4').textContent=t.t4(V.atual,pc(base.service_level,0),pc(less.service_level,0));$('p4').textContent=t.p4(nf(V.chamadas_hora),pc(V.meta,0),V.espera_s);

const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
