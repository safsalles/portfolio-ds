# Configuracao FIXA usada pelos testes (nao depende do config.toml de quem usa o projeto).
[trip]
outbound = ["GIG", "BUD", "2027-07-10"]
inbound = ["BER", "GIG", "2027-07-22"]
adults = 2
cabin = "economy"
currency = "BRL"

[rules]
min_layover_minutes = 240
avoid_airports = []

[alerts]
drop_pct = 5.0
target_brl = 18000

[promos]
feeds = ["https://exemplo.test/feed/"]
keywords = ["flying blue", "smiles", "livelo", "tap", "milheiro", "bônus"]

[promos.max_milheiro]
"flying blue" = 35
"tap" = 35
"livelo" = 35
"smiles" = 12

[paths]
history = "data/history.csv"
seen_promos = "data/seen_promos.json"
alerts_log = "data/alerts.log"

[baggage]
carry_on = 2
checked = 1
checked_bag_fee_brl = 600
