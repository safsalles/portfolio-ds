name: Publica o memga no PyPI

# Roda quando uma release do GitHub é publicada com uma tag que começa com "py-v",
# por exemplo py-v1.2.0. O envio usa Trusted Publishing: não há token guardado.
on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala as ferramentas e o pacote
        working-directory: mem-ga
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"

      - name: Roda os testes
        working-directory: mem-ga
        run: python -m pytest -q

      - name: Confere que a versão do pyproject é a da tag
        working-directory: mem-ga
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "py-v$version" != "$TAG" ]; then
            echo "A tag é $TAG, mas o pyproject.toml diz versão $version."
            exit 1
          fi

      - name: Gera os arquivos do pacote
        working-directory: mem-ga
        run: |
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mem-ga/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
